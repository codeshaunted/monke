[package]
name = "monke"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Pack and unpack Ninja Kiwi save files"
repository = "https://github.com/codeshaunted/monke"

[dependencies]
aes = "0.9.2"
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4.6.4", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
pbkdf2 = "0.13.0"
rand = "0.10.2"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
